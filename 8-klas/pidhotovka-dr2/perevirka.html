<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Перевірка коду · ДР № 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&family=Neucha&display=swap">
<style>
:root{--paper:#f7f8f4;--grid:#d9e3ec;--card:#ffffff;--ink:#1c3f94;--text:#1d2330;--muted:#5d6676;--margin:#d2473f;--line:#c9d3de;
  --f-hand:"Neucha","Comic Sans MS",cursive;--f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121826;--grid:#1e2839;--card:#182032;--ink:#9db8ff;--text:#e4e8f1;--muted:#9aa5b8;--margin:#e0675e;--line:#2c3850;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121826;--grid:#1e2839;--card:#182032;--ink:#9db8ff;--text:#e4e8f1;--muted:#9aa5b8;--margin:#e0675e;--line:#2c3850;color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-hand);font-size:2rem;color:var(--ink);margin:0;line-height:1.1}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px}
label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input,select{font:inherit;width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);min-height:52px}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--card);padding:12px 16px;cursor:pointer;min-height:48px;margin-top:6px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(2rem,10vw,3rem);letter-spacing:.18em;color:var(--ink);font-weight:700;margin:0}
p{margin:0}.hint{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Перевірка коду · ДР № 2</h1>
  <section class="sheet">
    <p class="hint">Уведіть дані з екрана учня. Великі й малі літери та зайві пробіли в імені не важать.</p>
    <label for="nm">Прізвище та ім’я</label><input id="nm" autocomplete="off">
    <label for="dt">Дата</label><input id="dt" type="date">
    <label for="rs">Результат</label><select id="rs"><option>6/8</option><option>7/8</option><option>8/8</option></select>
    <button class="btn" id="go">Показати код</button>
    <div id="out"></div>
  </section>
</div>
<script src="kod.js"></script>
<script>
const $=id=>document.getElementById(id);
const t=new Date();$('dt').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
$('go').onclick=()=>{
  if(!$('nm').value.trim()||!$('dt').value){$('out').innerHTML='<p class="hint">Заповніть ім’я і дату.</p>';return}
  const [y,m,d]=$('dt').value.split('-').map(Number);
  $('out').innerHTML='<label>Мав вийти код</label><p class="code">'+kod($('nm').value,dateStr(new Date(y,m-1,d)),$('rs').value)+'</p><p class="hint">Збігається з кодом на екрані учня — результат справжній.</p>';
};
</script>
</body>
</html>
